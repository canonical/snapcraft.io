name: Cancel stale Auto QA

on:
  pull_request:
    types: [synchronize]

permissions: {}

# Match the group used when auto-qa.md is triggered by the auto-qa label.
# Concurrency is workflow-level, so cancellation also works if the job is skipped
# after the label has been removed. Never start a replacement browser/AI run.
concurrency:
  group: auto-qa-${{ github.event.pull_request.number }}-qa
  cancel-in-progress: true

jobs:
  cancel-stale-qa:
    if: contains(github.event.pull_request.labels.*.name, 'auto-qa')
    runs-on: ubuntu-latest
    steps:
      - name: Leave QA stopped until the current demo is ready and relabeled
        run: echo 'Stale Auto QA cancelled. Re-add auto-qa after the new demo is ready.'
