name: Auto QA workflow tests

on:
  pull_request:
    paths:
      - .github/workflows/auto-qa.md
      - .github/workflows/auto-qa.lock.yml
      - .github/workflows/auto-qa-tests.yml
      - .github/tests/auto-qa.test.cjs
  push:
    branches: [main]
    paths:
      - .github/workflows/auto-qa.md
      - .github/workflows/auto-qa.lock.yml
      - .github/workflows/auto-qa-tests.yml
      - .github/tests/auto-qa.test.cjs

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Test QA context and security guards (no dependencies)
        run: node --test .github/tests/auto-qa.test.cjs
