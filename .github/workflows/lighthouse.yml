name: Lighthouse CI

on:
  pull_request:
    paths:
      - ".github/workflows/lighthouse.yml"
      - ".lighthouserc.js"
      - "templates/**"
      - "static/js/**"
      - "static/sass/**"
      - "webapp/**"
      - "vite.config.js"
      - "package.json"
      - "yarn.lock"
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build application image
        run: DOCKER_BUILDKIT=1 docker build --tag snapcraft-io .

      - name: Start application container
        run: |
          docker run -d -p 8004:80 --env SECRET_KEY=insecure_secret_key snapcraft-io
          sleep 1 && curl --head --fail --retry-delay 5 --retry 10 --retry-connrefused http://127.0.0.1:8004

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc.js
          uploadArtifacts: true
          temporaryPublicStorage: true
