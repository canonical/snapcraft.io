name: Lighthouse CI

on:
  pull_request:
    paths:
      - ".github/workflows/lighthouse.yml"
      - ".lighthouserc.js"
      - "templates/**"
      - "static/js/**"
      - "static/sass/**"
      - "webapp/**"
      - "rockcraft.yaml"
      - "vite.config.js"
      - "package.json"
      - "yarn.lock"
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup LXD
        uses: canonical/setup-lxd@main

      - name: Setup rockcraft
        run: sudo snap install rockcraft --classic

      - name: Build rock
        run: rockcraft pack

      - name: Import rock into Docker
        run: |
          ROCK_FILE="$(ls -1 snapcraft-io_*.rock | head -n 1)"
          rockcraft.skopeo --insecure-policy copy \
            "oci-archive:${ROCK_FILE}" \
            docker-daemon:snapcraft-io:rock

      - name: Start rock container
        run: |
          docker run -d -p 8004:8000 \
            --env FLASK_SECRET_KEY=insecure_secret_key \
            --env ENVIRONMENT=production \
            snapcraft-io:rock
          sleep 1 && curl --head --fail --retry-delay 5 --retry 10 --retry-connrefused http://127.0.0.1:8004

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc.js
          uploadArtifacts: true
          temporaryPublicStorage: true
