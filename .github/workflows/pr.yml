name: PR checks
on: pull_request

env:
  SECRET_KEY: insecure_test_key
  LP_API_USERNAME: test_lp_user

jobs:
  run-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: DOCKER_BUILDKIT=1 docker build --tag snapcraft-io .
      - name: Run image
        run: |
          docker run -d -p 80:80 --env SECRET_KEY=insecure_secret_key snapcraft-io
          sleep 1 && curl --head --fail --retry-delay 5 --retry 10 --retry-connrefused http://localhost

  run-dotrun:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Dotrun
        run: |
          sudo pip3 install dotrun requests==2.31.0 # requests version is pinned to avoid breaking changes, can be removed once issue is resolved: https://github.com/docker/docker-py/issues/3256

      - name: Install dependencies
        run: |
          sudo chmod -R 777 .
          dotrun install

      - name: Build assets
        run: dotrun build

      - name: Run dotrun
        run: |
          dotrun &
          curl --head --fail --retry-delay 3 --retry 30 --retry-connrefused http://localhost:8004

  run-workshop:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: canonical/launch-workshop@v1

      - name: Run workshop
        run: |
          workshop run -- start &
          sleep 10
          curl --head --fail --retry-delay 3 --retry 30 --retry-connrefused http://localhost:8004 # check that Flask works
          curl --head --fail --retry-delay 3 --retry 30 --retry-connrefused http://localhost:5004/@vite/client # check that Vite works

  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      py: ${{ steps.filter.outputs.py }}
      js: ${{ steps.filter.outputs.js }}
      scss: ${{ steps.filter.outputs.scss }}
      lighthouse: ${{ steps.filter.outputs.lighthouse }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            py:
              - '**/*.py'
              - 'requirements.txt'
              - 'templates/**/*'
            js:
              - '**/*.js'
              - '**/*.ts'
              - '**/*.jsx'
              - '**/*.tsx'
              - 'package.json'
              - 'yarn.lock'
              - 'eslint.config.mjs'
              - 'vitest.config.js'
              - 'vite.config.js'
              - 'tsconfig.json'
              - 'babel.config.json'
            scss:
              - '**/*.scss'
              - '.stylelintrc'
              - 'package.json'
              - 'yarn.lock'
            lighthouse:
              - '.github/workflows/pr.yml'
              - '.lighthouserc.js'
              - 'templates/**'
              - 'static/js/**'
              - 'static/sass/**'
              - 'webapp/**'
              - 'rockcraft.yaml'
              - 'vite.config.js'
              - 'package.json'
              - 'yarn.lock'
              - 'requirements.txt'

  pack-rock:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup LXD
        uses: canonical/setup-lxd@main

      - name: Setup rockcraft
        run: sudo snap install rockcraft --classic

      - name: Pack rock
        run: rockcraft pack

      - name: Import rock into Docker
        run: |
          ROCK_FILE="$(ls -1 snapcraft-io_*.rock | head -n 1)"
          rockcraft.skopeo --insecure-policy copy \
            "oci-archive:${ROCK_FILE}" \
            docker-daemon:snapcraft-io:rock

      - name: Start rock container
        run: |
          docker run -d -p 8004:8000 \
            --env FLASK_SECRET_KEY=insecure_secret_key \
            --env ENVIRONMENT=production \
            snapcraft-io:rock
          sleep 1 && curl --head --fail --retry-delay 5 --retry 10 \
            --retry-connrefused http://127.0.0.1:8004

      - name: Run Lighthouse CI
        if: ${{ needs.changes.outputs.lighthouse == 'true' }}
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        with:
          configPath: ./.lighthouserc.js
          uploadArtifacts: true
          temporaryPublicStorage: true

  lint-python:
    needs: changes
    if: ${{ needs.changes.outputs.py == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dotrun
        run: sudo pip3 install dotrun

      - name: Install dependencies
        run: |
          sudo chmod -R 777 .
          dotrun install

      - name: Build assets
        run: dotrun build

      - name: Lint python
        run: dotrun lint-python

  lint-scss:
    needs: changes
    if: ${{ needs.changes.outputs.scss == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install SCSS dependencies
        run: yarn install --immutable

      - name: Lint SCSS
        run: yarn lint-scss

  lint-js:
    needs: changes
    if: ${{ needs.changes.outputs.js == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install JS dependencies
        run: yarn install --immutable

      - name: Lint JS
        run: yarn lint-js

  test-python:
    needs: changes
    if: ${{ needs.changes.outputs.py == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install dotrun
        run: sudo pip3 install dotrun

      - name: Install dependencies
        run: |
          sudo chmod -R 777 .
          dotrun install

      - name: Install dependencies
        run: sudo pip3 install coverage

      - name: Build resources
        run: dotrun build

      - name: Run python tests with coverage
        run: dotrun test-python-job

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          flags: python

  test-js:
    needs: changes
    if: ${{ needs.changes.outputs.js == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run JS tests with coverage
        run: |
          yarn test-js --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          flags: javascript

  check-inclusive-naming:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check inclusive naming
        uses: canonical/inclusive-naming@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          fail-on-error: true
