<div class="p-modal u-hide" id="contact-form-modal">
  <section class="p-modal__dialog" role="dialog" aria-modal="true" aria-labeledby="modal-title">
    <header class="p-modal__header">
      <h2 class="p-modal__title">Contact us</h2>
      <button class="p-modal__close" aria-label="Close active modal" aria-controls="modal" data-js="close-modal-control">Close</button>
    </header>
    <div id="modal-body"></div>
    <div hidden class="js-contact-success">
      <p class="p-heading--3">Thanks for contacting us</p>
      {% include "shared/_contact-thank-you.html" %}
    </div>
    <div hidden class="js-contact-error">
      {% include "shared/_contact-error-message.html" %}
      <button class="p-button--positive js-contact-try-again">Try again</button>
    </div>
  </section>
</div>

<script type="text/template" id="contactFormTemplate">
  {% with formid="{{formid}}",
   product="appstore",
   returnURL="https://snapcraft.io/about/thank-you" %}
    {% include "shared/contact-form.html" %}
  {% endwith %}
</script>
