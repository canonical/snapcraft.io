<div class="p-modal u-hide js-contact-modal" id="contact-form-modal">
  <section class="p-modal__dialog" role="dialog" aria-modal="true" tabindex="-1" aria-labelledby="contact-form-modal-title">
    <header class="p-modal__header">
      <h2 class="p-modal__title" id="contact-form-modal-title">Contact us</h2>
      <button class="p-modal__close js-contact-modal-close" aria-label="Close active modal" aria-controls="contact-form-modal">Close</button>
    </header>
    <div class="js-contact-form-panel">
      {% include "shared/contact-form.html" %}
    </div>
    <div hidden class="js-contact-success">
      <h3 class="p-heading--3">Thanks for contacting us</h3>
      {% with message_tag="p" %}
        {% include "shared/_contact-thank-you.html" %}
      {% endwith %}
    </div>
  </section>
</div>
