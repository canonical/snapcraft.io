name: human-authored
version: 1
description: Compile an engineer-owned spec and testing plan into capability deltas and a tracked TDD checklist.

artifacts:
  - id: human-spec
    generates: human-spec.md
    description: Authoritative engineer-authored specification (input, not generated).
    template: human-spec.md
    instruction: |
      This is a HUMAN-OWNED INPUT, not an artifact for the agent to author.
      Use the reviewed Markdown specification supplied by the engineer.
      If the engineer provides its path, copy the file unchanged to this artifact's
      resolved output path. Preserve its contents and format; do not summarize,
      expand, correct, or fill in this template. Do not overwrite an existing
      input unless the engineer explicitly supplies a replacement revision.
      If no document was supplied, or it is empty, a placeholder, or has unresolved
      decisions needed for this change, STOP and ask the engineer for the input.
      Do not infer the specification from a task description, Jira, code, tests,
      conversation, or the testing plan. Human decisions belong in this document.
    requires: []

  - id: testing-plan
    generates: testing-plan.md
    description: Authoritative engineer-authored testing plan (input, not generated).
    template: testing-plan.md
    instruction: |
      This is a HUMAN-OWNED INPUT, not an artifact for the agent to author.
      Use the reviewed Markdown testing plan supplied by the engineer.
      If the engineer provides its path, copy the file unchanged to this artifact's
      resolved output path. Preserve its contents and format; do not summarize,
      expand, correct, or fill in this template. Do not overwrite an existing
      input unless the engineer explicitly supplies a replacement revision.
      If no document was supplied, or it is empty, a placeholder, or has unresolved
      quality gates needed for this change, STOP and ask the engineer for it.
      Do not invent test cases, methodologies, thresholds, or acceptance criteria.
      These are human decisions, not gaps for the compiler to fill.
    requires: []

  - id: specs
    generates: "specs/**/spec.md"
    description: Capability deltas translated from the two approved inputs.
    template: spec.md
    instruction: |
      Compile human-spec.md and testing-plan.md; do not design a new solution.
      Read BOTH inputs in full from this change. They must be engineer-supplied,
      substantive documents, not templates or generated substitutes. They are
      authoritative for scope, behavior, design constraints, and quality gates.
      Existing code and main specs provide baseline facts, not permission to add
      decisions. Mechanical translation, capability mapping, and decomposition
      are allowed only when they preserve the agreed meaning.

      Before writing, check the inputs for contradictions, missing outcomes,
      ambiguous scope, and unresolved decisions that affect translation. Verify
      that the test expectations agree with the spec. If a necessary decision is
      missing or the inputs conflict, STOP, cite the affected source passages,
      and ask the engineer to reconcile the inputs. Do not choose a winner,
      invent defaults, propose alternatives as settled decisions, or write a
      provisional artifact that would make downstream work appear ready.

      Inspect the capability inventory with openspec list --specs, then read the
      relevant main specs in full, including scenarios. Use the resolved planning
      root. Reuse existing capability paths and requirement names exactly.
      Introduce a new capability only for behavior present in the human inputs;
      derive its name from that behavior, following the existing organization.
      Ask if the ownership boundary is ambiguous. With no existing main spec,
      use ADDED only for approved behavior; do not invent a historical baseline.

      Write one delta at specs/<capability-path>/spec.md per affected capability.
      List the full expected set in implementation-plan.md later; a matching
      specs glob alone does not establish that all capabilities were covered.
      Do not produce proposal.md, design.md, or an extra decision document.
      Preserve approved internal design constraints in the implementation plan;
      do not turn implementation steps into artificial behavior requirements.

      Use native OpenSpec delta syntax, including only applicable sections:
      - ## ADDED Requirements: new requirements.
      - ## MODIFIED Requirements: the ENTIRE updated existing requirement block,
        including all retained scenarios. Preserve unaffected behavior verbatim.
      - ## REMOVED Requirements: exact existing name, **Reason** and **Migration**
        grounded in the human spec. If either is unknown, ask instead of inventing.
      - ## RENAMED Requirements: paired FROM/TO lines with the exact requirement
        names; a rename does not itself authorize a behavior change.
      For a new capability only, include ## Purpose before the delta operations,
      describing the approved purpose in at least 50 characters. Do not add a
      Purpose section to an existing capability's delta.

      Each added or modified requirement uses ### Requirement: <name> and a
      SHALL/MUST statement, with at least one #### Scenario: <name> containing
      **WHEN** (or **GIVEN**) and **THEN** steps. Translate only agreed outcomes;
      do not invent edge cases to satisfy this format. Keep new requirement
      descriptions concise (500 characters or fewer) without losing meaning.
      Never trim a retained requirement to satisfy a formatting warning.

      Cite the source file plus existing heading, ID, or precise passage for
      each changed requirement and scenario. Identify unchanged material copied
      from a main spec as retained baseline, not a newly approved decision.
      Record the SHA-256 of both input files in an HTML comment in the delta
      preamble so stale translations can be identified. Compute hashes; never
      fabricate them. Use a preamble HTML comment for rename source references
      too: ordinary preamble text is rejected by strict validation because archive
      does not merge it. Keep requirement/scenario references within their blocks.
      Keep traceability in the delta, not a separate generated document.

      Check coverage in both directions: no approved behavior change omitted;
      no new requirement or scenario without input support. Quality gates that
      are not behavior contracts belong in the plan, not artificial deltas.
      Do not fabricate a delta for a spec-free change. Stop and ask the engineer
      whether an explicit no-delta workflow is intended instead.
      If existing outputs were compiled from different input revisions, stop
      and request reconciliation; do not silently overwrite them or task progress.
    requires:
      - human-spec
      - testing-plan

  - id: tasks
    generates: implementation-plan.md
    description: Source-linked red/green/refactor checklist with verifiable completion criteria.
    template: implementation-plan.md
    instruction: |
      Compile an executable TDD checklist from human-spec.md, testing-plan.md,
      and all capability deltas. Re-read all of them from disk. Check the deltas'
      recorded input hashes against the current files before planning. If they
      differ, STOP for reconciliation; never plan against stale translations.

      The inputs own all scope, architecture, dependencies, behavior, test
      methodologies, acceptance criteria, thresholds, and tradeoffs. You may
      inspect code and tests to identify existing integration points, commands,
      file paths, and dependency order. You may decompose approved work into
      small steps. You must not select a new architecture or dependency, extend
      scope, relax a gate, or resolve an undecided requirement. Missing decisions,
      conflicting artifacts, or missing test expectations are compilation errors:
      cite the source passages and ask the engineer to amend the inputs first.
      Preserve approved design constraints in this plan with source references;
      do not add a separate design or proposal phase.

      Record the computed SHA-256 of both inputs. List every expected capability
      delta path, and confirm the set is complete before writing the checklist.
      Include a compact coverage map from each in-scope behavior and each testing
      plan gate to its delta (where applicable) and checklist task IDs. A manual
      gate maps to a human-owned task, not to an invented automated test.

      Group tasks into small, dependency-ordered behavior slices, not separate
      batches of all tests followed by all production code. For each automated
      behavior use separate numbered checkboxes for:
      1. RED: implement the specified test and run it; observe failure because
         the approved behavior is absent, not because of setup/import errors.
      2. GREEN: implement only the approved behavior and run that test to pass.
      3. REFACTOR/VERIFY: review the touched code for behavior-preserving cleanup,
         change it only if warranted, and rerun the relevant tests. No new design.
      If a behavior already exists, use a verification task with observed evidence
      instead of inventing a red failure; if this conflicts with the testing plan,
      stop and ask. Preserve performance, property, regression, E2E, and manual
      gates exactly when the human plan calls for them; do not force non-automated
      gates into artificial red/green cycles. Include required setup and existing
      repository build/lint checks without inventing new product quality policy.

      Every tracked task uses - [ ] N.M <phase/owner>: <action>; verify: <evidence>.
      Each task must cite source sections/IDs and relevant delta requirements or
      scenarios, name its completion evidence, and use real paths/commands when
      known from inspection. Do not leave placeholders in the final plan. Use
      stable unique IDs. Start all tasks unchecked; planning is not execution.
      Include tests and required documentation in the slice that needs them.
      Do not hide unapproved work in generic setup, hardening, or refactor tasks.

      Include a final agent verification task covering the approved gates and
      consistency of tests with the testing plan. Keep an evidence area in this
      same file, keyed by task ID, for commands, results, and blockers during apply.
      The supplied overarching workflow requires engineer QA: keep it as an
      explicitly HUMAN-owned checkbox, using only the criteria in the human
      inputs. This is a workflow task, not permission to invent quality gates.
      The agent must wait for engineer confirmation to complete it; automation
      is not QA approval.
      Preserve any approved deployment/archive follow-up as plain bullets outside
      tracked tasks when it depends on this change being completed/archived.
      Do not create checkboxes in examples or evidence: all checkboxes are counted.

      Before finishing, check coverage in both directions: all approved behaviors
      and quality gates are represented, and every task is either source-backed,
      the workflow's engineer QA handoff, or an existing repository prerequisite
      for executing that approved work.
      Do not overwrite an existing plan or reset completed tasks automatically;
      input revisions require explicit reconciliation and re-verification of any
      completion evidence that may no longer apply.
    requires:
      - human-spec
      - testing-plan
      - specs

apply:
  requires: [human-spec, testing-plan, specs, tasks]
  tracks: implementation-plan.md
  instruction: |
    Execute the compiled plan, not a new design process. Read both human-owned
    inputs, every delta, and implementation-plan.md. Before implementation or
    resumption, recompute both input hashes and compare them with the outputs;
    check the expected delta inventory and source-to-task coverage. Run openspec
    validate <change-name> --strict. Missing, placeholder, stale, contradictory,
    or invalid artifacts block implementation even if CLI file-existence checks
    report ready. Report any such blocker; do not repair human inputs yourself.

    Work through pending tasks in dependency order, completing one behavior's
    RED, GREEN, and REFACTOR/VERIFY cycle before the next dependent behavior.
    RED requires an observed failure for the intended missing behavior. GREEN
    requires a passing test of that behavior. Setup errors, skipped tests, or
    weakened assertions are not evidence of success. Keep tests faithful to the
    approved testing plan, including during refactoring. Run the existing project
    prerequisites and commands; never claim an unexecuted check passed.

    Record concise evidence (command/check, observed result, task ID) in the
    implementation plan, then mark only that verified task - [x]. Confirm the
    returned sourcePath and line still identify the task before editing it.
    After each completion, rerun openspec instructions apply --change <change-name>
    --json to refresh task locations and verify progress advanced. Resume at the
    first pending task whose prerequisites are complete. Preserve prior evidence.

    Stop for unclear tasks, unexpected failures, mismatched tests, or any missing
    product, design, or quality decision. Cite the conflicting inputs/artifacts
    and ask the engineer to resolve the issue. Do not silently add/drop tasks,
    relax criteria, introduce dependencies, rewrite inputs/deltas, or treat a
    conversation-only decision as a revised source document. Recompile affected
    outputs only after the engineer supplies reconciled inputs and requests it;
    recheck affected completion evidence rather than preserving stale ticks.

    For a HUMAN-owned QA task, present the results and wait for explicit engineer
    confirmation. Leave its checkbox unchecked until that confirmation is given.
    If blocked, record the blocker without marking the task done and report the
    actual progress. Never infer QA approval or deployment authorization from
    passing automated tests or the CLI's all_done state.
